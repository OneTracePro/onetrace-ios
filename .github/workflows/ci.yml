name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Core tests (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    name: iOS build and tests (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$id" >> "$GITHUB_OUTPUT"
      - name: Build every target for iOS, including UIKit and UserNotifications code
        run: xcodebuild -scheme OneTrace-Package -destination "id=${{ steps.simulator.outputs.udid }}" build test | xcpretty || exit ${PIPESTATUS[0]}
